services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metacognitive-testing
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin_secret_key_888}
      - JWT_SECRET=${JWT_SECRET:-metacognitive-testing-auth-secret-key-2026}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_GITHUB_ENABLED=${AUTH_GITHUB_ENABLED:-true}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - AUTH_LINUXDO_ENABLED=${AUTH_LINUXDO_ENABLED:-true}
      - LINUXDO_CLIENT_ID=${LINUXDO_CLIENT_ID:-}
      - LINUXDO_CLIENT_SECRET=${LINUXDO_CLIENT_SECRET:-}
      - AUTH_GOOGLE_ENABLED=${AUTH_GOOGLE_ENABLED:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./data:/app/data
